server.port=8081
#desactivar el petstore default
springdoc.swagger-ui.disable-swagger-default-url=true
#redirigir el default de swagger a la url de la api
springdoc.swagger-ui.url=/v3/api-docs
#actuator de metricas, comentar el segundo porque es para DEV
# /actuator/metrics/jvm.memory.used para ver la memoria usada
# /actuator/loggers niveles de logeo de cada paquete
#management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoints.web.exposure.include=*

# Reduce el tiempo de espera y reintentos para que la app no se cuelgue al iniciar
spring.kafka.producer.retries=0
spring.kafka.producer.properties.max.block.ms=1000
# desactivar kafka
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092